name: Build and Run Docker Image

on:
  push:
    branches:
      - main
      - release/**

jobs:
  build-and-run:
    name: Build and Run Docker Image
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker (Docker is already installed on GitHub runners)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Build Docker image (multi-stage build will compile the JAR)
      - name: Build Docker Image
        run: docker build -t devopsimage .

      # 4. Run container detached
      - name: Run Docker container
        run: docker run --rm --name devopscontainer -d devopsimage

      # 5. Show logs from the container
      - name: View container logs
        run: docker logs devopscontainer
