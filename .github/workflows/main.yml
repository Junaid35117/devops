name: Build and Test WorldDB App

on:
  push:
    branches:
      - main
      - release/**
      - develop

jobs:
  build:
    name: Build and Run App with MySQL
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout code including submodules
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build Maven project
      - name: Build Maven project
        run: mvn clean package

      # 4. Run Docker Compose (app + MySQL worlddb)
      - name: Run Docker Compose
        run: docker compose up --abort-on-container-exit
