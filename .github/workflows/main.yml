name: Build and Run WorldDB App

on:
  push:
    branches:
      - master
      - develop
      - release/*

jobs:
  build:
    name: Build and Run App with MySQL
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout the code including submodules
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build the fat JAR with Maven
      - name: Build with Maven
        run: mvn clean package

      # 4. Run Docker Compose (app + worlddb)
      - name: Run Docker Compose
        run: docker compose up --abort-on-container-exit
